name: Vendor Onyx SDK

# Downloads the Onyx pen SDK AARs from repo.boox.com and uploads them as an artifact, with
# SHA-256 sums. repo.boox.com offers only a weak Diffie-Hellman key exchange, which current
# OpenSSL and Java reject ("dh key too small"). The relaxed security level applies to these
# curl calls only; normal builds use the committed AARs in app/libs and never contact the host.
# See README "Onyx SDK dependencies" for how to refresh.
on:
  workflow_dispatch:
  push:
    branches: [vendor-onyx]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download AARs
        run: |
          set -euo pipefail
          base=https://repo.boox.com/repository/maven-public/com/onyx/android/sdk
          mkdir -p out
          for spec in onyxsdk-pen:1.4.12 onyxsdk-base:1.7.7 onyxsdk-device:1.2.31; do
            name=${spec%%:*}; ver=${spec##*:}
            for ext in aar pom; do
              curl -fsSL --retry 3 --ciphers 'DEFAULT:@SECLEVEL=0' \
                -o "out/$name-$ver.$ext" "$base/$name/$ver/$name-$ver.$ext"
            done
          done
          cd out && sha256sum *.aar | tee SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-sdk
          path: out/
          if-no-files-found: error
